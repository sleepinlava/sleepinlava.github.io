<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>医学英语词汇训练</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f0f4f8;
  --card: #ffffff;
  --text: #1a2332;
  --text-light: #5a6d80;
  --accent: #2563eb;
  --accent-light: #dbeafe;
  --green: #059669;
  --green-light: #d1fae5;
  --red: #dc2626;
  --red-light: #fee2e2;
  --border: #e2e8f0;
  --shadow: 0 4px 24px rgba(0,0,0,.08);
  --radius: 16px;
  --radius-sm: 10px;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: 20px;
}

.app { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 20px; }

.header { text-align: center; }
.header h1 { font-size: 1.5rem; font-weight: 700; color: var(--text); letter-spacing: -.02em; }
.header .subtitle { font-size: .85rem; color: var(--text-light); margin-top: 2px; }

.filter-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
.filter-bar label { font-size: .85rem; color: var(--text-light); white-space: nowrap; }
.filter-bar select { padding: 6px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: .85rem; background: var(--card); color: var(--text); cursor: pointer; }

.tabs { display: flex; background: var(--card); border-radius: var(--radius); padding: 4px; box-shadow: var(--shadow); }
.tab { flex: 1; padding: 10px 8px; text-align: center; border: none; background: transparent; border-radius: var(--radius-sm); cursor: pointer; font-size: .85rem; font-weight: 500; color: var(--text-light); transition: all .2s; }
.tab.active { background: var(--accent); color: #fff; }
.tab:hover:not(.active) { background: var(--accent-light); }

.stats { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.stat { background: var(--card); border-radius: var(--radius-sm); padding: 10px 18px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,.04); min-width: 60px; }
.stat .num { font-size: 1.3rem; font-weight: 700; color: var(--accent); }
.stat .label { font-size: .7rem; color: var(--text-light); margin-top: 2px; }

/* Card */
.card-box { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 40px 24px; min-height: 300px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; position: relative; overflow: hidden; transition: transform .3s, box-shadow .3s; }
.card-box.clickable { cursor: pointer; user-select: none; }
.card-box.clickable:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0,0,0,.12); }

.card-tag { position: absolute; top: 14px; left: 18px; font-size: .7rem; color: var(--text-light); background: var(--bg); padding: 3px 10px; border-radius: 20px; }

.word-big { font-size: 2rem; font-weight: 700; color: var(--text); letter-spacing: -.01em; }
.word-pos { font-size: .85rem; color: var(--text-light); margin-top: 6px; font-style: italic; }
.word-meaning { font-size: 1.3rem; color: var(--accent); margin-top: 16px; font-weight: 600; }
.word-hint { font-size: .8rem; color: var(--text-light); margin-top: 12px; }
.word-count { font-size: .75rem; color: var(--text-light); margin-top: 4px; }

/* Actions */
.actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.btn { padding: 12px 28px; border: none; border-radius: var(--radius-sm); font-size: .95rem; font-weight: 600; cursor: pointer; transition: all .2s; }
.btn:active { transform: scale(.96); }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: #1d4ed8; }
.btn-success { background: var(--green); color: #fff; }
.btn-success:hover { background: #047857; }
.btn-danger { background: var(--red); color: #fff; }
.btn-danger:hover { background: #b91c1c; }
.btn-ghost { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
.btn-ghost:hover { background: var(--border); }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

/* Fill-blank */
.fill-row { display: flex; gap: 8px; width: 100%; max-width: 400px; }
.fill-input { flex: 1; padding: 12px 16px; border: 2px solid var(--border); border-radius: var(--radius-sm); font-size: 1.1rem; font-family: inherit; outline: none; transition: border-color .2s; }
.fill-input:focus { border-color: var(--accent); }
.fill-input.correct { border-color: var(--green); background: var(--green-light); }
.fill-input.wrong { border-color: var(--red); background: var(--red-light); }

/* Options grid */
.options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; margin-top: 20px; }
.option-btn { padding: 16px 12px; border: 2px solid var(--border); border-radius: var(--radius-sm); background: var(--card); font-size: 1rem; cursor: pointer; transition: all .15s; text-align: center; font-family: inherit; color: var(--text); }
.option-btn:hover { border-color: var(--accent); background: var(--accent-light); }
.option-btn.correct { border-color: var(--green); background: var(--green-light); color: var(--green); font-weight: 700; }
.option-btn.wrong { border-color: var(--red); background: var(--red-light); color: var(--red); }
.option-btn:disabled { cursor: default; }
.option-btn:disabled:hover { border-color: var(--border); background: var(--card); }
.option-btn:disabled.correct:hover { border-color: var(--green); background: var(--green-light); }
.option-btn:disabled.wrong:hover { border-color: var(--red); background: var(--red-light); }

.feedback { font-size: 1rem; font-weight: 600; min-height: 28px; margin-top: 16px; transition: all .2s; }
.feedback.ok { color: var(--green); }
.feedback.bad { color: var(--red); }

.toggle-row { display: flex; align-items: center; gap: 8px; justify-content: center; font-size: .85rem; color: var(--text-light); }
.toggle-row input { accent-color: var(--accent); }

.kbd-hint { font-size: .75rem; color: var(--text-light); text-align: center; margin-top: 8px; }
.kbd { display: inline-block; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; font-size: .7rem; font-family: monospace; }

@media (max-width: 480px) {
  .app { gap: 14px; }
  .card-box { padding: 28px 16px; min-height: 240px; }
  .word-big { font-size: 1.5rem; }
  .word-meaning { font-size: 1.1rem; }
  .options-grid { grid-template-columns: 1fr; gap: 8px; }
  .option-btn { padding: 14px 10px; font-size: .9rem; }
  .tab { font-size: .75rem; padding: 8px 4px; }
  .btn { padding: 10px 20px; font-size: .85rem; }
}

@keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.fade-in { animation: fadeInUp .35s ease both; }

@keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-6px)} 40%,80%{transform:translateX(6px)} }
.shake { animation: shake .4s ease; }

@keyframes pop { 0%{transform:scale(1)} 50%{transform:scale(1.08)} 100%{transform:scale(1)} }
.pop { animation: pop .3s ease; }

.done-icon { font-size: 3rem; margin-bottom: 12px; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>Medical English Vocab Trainer</h1>
    <div class="subtitle" id="subtitle">医学英语词汇训练 · 加载中...</div>
  </div>

  <div class="filter-bar">
    <label for="unitSelect">单元:</label>
    <select id="unitSelect"><option value="all">All Units</option></select>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab active" data-mode="flashcard"> 单词卡片</button>
    <button class="tab" data-mode="fillblank"> 单词补写</button>
    <button class="tab" data-mode="baicizhan"> 百词斩式</button>
  </div>

  <div class="stats" id="stats">
    <div class="stat"><div class="num" id="statTotal">0</div><div class="label">本轮</div></div>
    <div class="stat"><div class="num" id="statCorrect">0</div><div class="label">正确</div></div>
    <div class="stat"><div class="num" id="statStreak">0</div><div class="label">连击</div></div>
    <div class="stat"><div class="num" id="statAccuracy">-</div><div class="label">正确率</div></div>
  </div>

  <!-- ====== Flashcard Mode ====== -->
  <div id="modeFlashcard">
    <div class="toggle-row" style="margin-bottom:10px">
      <input type="checkbox" id="fcShuffle" checked><label for="fcShuffle">随机顺序</label>
    </div>
    <div class="card-box clickable fade-in" id="fcCard">
      <div class="card-tag" id="fcTag"></div>
      <div class="word-big" id="fcWord"></div>
      <div class="word-pos" id="fcPos"></div>
      <div class="word-meaning" id="fcMeaning"></div>
      <div class="word-hint" id="fcHint">点击卡片翻转</div>
    </div>
    <div class="actions" id="fcActions" style="margin-top:16px">
      <button class="btn btn-danger" id="fcBtnNo"> 不认识</button>
      <button class="btn btn-success" id="fcBtnYes"> 认识</button>
    </div>
    <div class="actions" style="margin-top:12px">
      <button class="btn btn-ghost" id="fcResetBtn"> 重新开始</button>
    </div>
    <div class="kbd-hint">
      按 <span class="kbd">Space</span> 翻转  <span class="kbd">&larr;</span> 不认识  <span class="kbd">&rarr;</span> 认识
    </div>
  </div>

  <!-- ====== Fill-in-Blank Mode ====== -->
  <div id="modeFillblank" style="display:none">
    <div class="toggle-row" style="margin-bottom:10px">
      <input type="checkbox" id="fbShuffle" checked><label for="fbShuffle">随机顺序</label>
    </div>
    <div class="card-box fade-in" id="fbCard">
      <div class="card-tag" id="fbTag"></div>
      <div class="word-meaning" id="fbMeaning" style="font-size:1.5rem"></div>
      <div class="word-hint" id="fbHint"></div>
      <div class="fill-row" style="margin-top:16px">
        <input type="text" class="fill-input" id="fbInput" placeholder="输入英文单词..." autocomplete="off" autocapitalize="off" spellcheck="false">
        <button class="btn btn-primary" id="fbSubmitBtn">确认</button>
      </div>
      <div class="feedback" id="fbFeedback"></div>
      <button class="btn btn-ghost" id="fbSkipBtn" style="margin-top:12px;font-size:.8rem">跳过 (显示答案)</button>
    </div>
    <div class="actions" style="margin-top:12px">
      <button class="btn btn-ghost" id="fbResetBtn"> 重新开始</button>
    </div>
    <div class="kbd-hint">
      按 <span class="kbd">Enter</span> 提交  <span class="kbd">Esc</span> 跳过
    </div>
  </div>

  <!-- ====== Baicizhan Mode ====== -->
  <div id="modeBaicizhan" style="display:none">
    <div class="toggle-row" style="margin-bottom:10px">
      <input type="checkbox" id="bzShuffle" checked><label for="bzShuffle">随机顺序</label>
    </div>
    <div class="card-box fade-in" id="bzCard">
      <div class="card-tag" id="bzTag"></div>
      <div class="word-big" id="bzWord" style="font-size:2.2rem"></div>
      <div class="word-pos" id="bzPos"></div>
      <div class="options-grid" id="bzOptions"></div>
      <div class="feedback" id="bzFeedback"></div>
      <div style="margin-top:12px">
        <button class="btn btn-ghost" id="bzNextBtn" style="display:none">下一题 </button>
      </div>
    </div>
    <div class="actions" style="margin-top:12px">
      <button class="btn btn-ghost" id="bzResetBtn"> 重新开始</button>
    </div>
    <div class="kbd-hint">
      按 <span class="kbd">1-4</span> 选择答案
    </div>
  </div>
</div>

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function getWords() {
  return currentUnit === 'all' ? [...allWords] : allWords.filter(w => w.unit === currentUnit);
}

// ========== Init ==========
function initApp() {
  allWords = EMBEDDED_WORDS;
  document.getElementById('subtitle').textContent = '医学英语词汇训练 · ' + allWords.length + ' 词条';

  const units = [...new Set(allWords.map(w => w.unit).filter(Boolean))];
  units.sort((a, b) => (parseInt(a) || 0) - (parseInt(b) || 0));
  const sel = document.getElementById('unitSelect');
  units.forEach(u => {
    const opt = document.createElement('option');
    opt.value = u; opt.textContent = 'Unit ' + u;
    sel.appendChild(opt);
  });

  initFlashcard();
}

// ========== Flashcard ==========
let fc = { queue: [], idx: 0, known: 0, flipped: false };

function restoreFcCard() {
  document.getElementById('fcCard').innerHTML = `
    <div class="card-tag" id="fcTag"></div>
    <div class="word-big" id="fcWord"></div>
    <div class="word-pos" id="fcPos"></div>
    <div class="word-meaning" id="fcMeaning"></div>
    <div class="word-hint" id="fcHint">点击卡片翻转</div>`;
}

function initFlashcard() {
  restoreFcCard();
  const card = document.getElementById('fcCard');
  fc.queue = shuffle(getWords());
  fc.idx = 0; fc.known = 0; fc.flipped = false;
  document.getElementById('fcMeaning').style.display = 'none';
  document.getElementById('fcPos').style.display = 'none';
  document.getElementById('fcActions').style.display = 'none';
  document.getElementById('fcHint').style.display = 'block';
  card.classList.remove('shake');
  card.style.cursor = 'pointer';
  card.onclick = flipCard;
  updateStats();
  showFcCard();
}

function showFcCard() {
  const el = (id) => document.getElementById(id);
  if (fc.idx >= fc.queue.length) {
    el('fcWord').textContent = '';
    el('fcTag').textContent = '';
    el('fcMeaning').textContent = '';
    el('fcMeaning').style.display = 'none';
    el('fcPos').style.display = 'none';
    el('fcHint').style.display = 'none';
    el('fcActions').style.display = 'none';
    el('fcCard').style.cursor = 'default';
    el('fcCard').onclick = null;
    el('fcCard').innerHTML = `<div class="done-icon">&#127881;</div><div class="word-big">本轮完成!</div><div class="word-meaning" style="display:block">认识 ${fc.known} / ${fc.queue.length} 个单词</div>`;
    return;
  }
  const w = fc.queue[fc.idx];
  el('fcTag').textContent = w.unit ? 'Unit ' + w.unit : '';
  el('fcWord').textContent = w.word;
  el('fcMeaning').textContent = w.meaning_cn || '';
  el('fcMeaning').style.display = 'none';
  el('fcPos').textContent = w.pos || '';
  el('fcPos').style.display = 'none';
  el('fcHint').style.display = 'block';
  el('fcHint').textContent = '点击卡片翻转';
  el('fcActions').style.display = 'none';
  fc.flipped = false;
  el('fcCard').style.cursor = 'pointer';
  el('fcCard').onclick = flipCard;
  el('fcCard').classList.remove('shake', 'pop');
  el('fcCard').classList.add('fade-in');
  setTimeout(() => el('fcCard').classList.remove('fade-in'), 350);
}

function flipCard() {
  if (fc.flipped || fc.idx >= fc.queue.length) return;
  fc.flipped = true;
  document.getElementById('fcMeaning').style.display = 'block';
  const pos = document.getElementById('fcPos');
  if (pos.textContent) pos.style.display = 'block';
  document.getElementById('fcHint').style.display = 'none';
  document.getElementById('fcActions').style.display = 'flex';
  document.getElementById('fcCard').classList.add('pop');
  setTimeout(() => document.getElementById('fcCard').classList.remove('pop'), 300);
}

function fcAnswer(known) {
  if (!fc.flipped) return;
  if (known) fc.known++;
  fc.idx++;
  updateStats();
  showFcCard();
}

// ========== Fill-in-Blank ==========
let fb = { queue: [], idx: 0, correct: 0, answered: false, timer: null };

function initFillblank() {
  fb.queue = shuffle(getWords());
  fb.idx = 0; fb.correct = 0; fb.answered = false;
  clearTimeout(fb.timer);
  restoreFbCard();
  updateStats();
  showFbCard();
  document.getElementById('fbInput').focus();
}

function restoreFbCard() {
  const card = document.getElementById('fbCard');
  card.innerHTML = `
    <div class="card-tag" id="fbTag"></div>
    <div class="word-meaning" id="fbMeaning" style="font-size:1.5rem"></div>
    <div class="word-hint" id="fbHint"></div>
    <div class="fill-row" style="margin-top:16px">
      <input type="text" class="fill-input" id="fbInput" placeholder="输入英文单词..." autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="btn btn-primary" id="fbSubmitBtn">确认</button>
    </div>
    <div class="feedback" id="fbFeedback"></div>
    <button class="btn btn-ghost" id="fbSkipBtn" style="margin-top:12px;font-size:.8rem">跳过 (显示答案)</button>`;
  // Re-bind events
  document.getElementById('fbSubmitBtn').onclick = fbSubmit;
  document.getElementById('fbSkipBtn').onclick = fbSkip;
  document.getElementById('fbInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); fbSubmit(); }
  });
}

function showFbCard() {
  clearTimeout(fb.timer);
  if (fb.idx >= fb.queue.length) {
    const card = document.getElementById('fbCard');
    card.innerHTML = `<div class="done-icon">&#127881;</div><div class="word-big">本轮完成!</div><div class="word-meaning" style="display:block">正确 ${fb.correct} / ${fb.queue.length}</div>`;
    return;
  }
  fb.answered = false;
  const w = fb.queue[fb.idx];
  document.getElementById('fbTag').textContent = w.unit ? 'Unit ' + w.unit : '';
  document.getElementById('fbMeaning').textContent = w.meaning_cn || '';
  const first = w.word.charAt(0);
  const len = w.word.length;
  const words = w.word.includes(' ') ? ` · ${w.word.split(' ').length} 个词` : '';
  document.getElementById('fbHint').textContent = `首字母: ${first} · ${len} 个字符${words}`;
  const inp = document.getElementById('fbInput');
  inp.value = ''; inp.className = 'fill-input'; inp.disabled = false; inp.focus();
  document.getElementById('fbFeedback').textContent = '';
  document.getElementById('fbFeedback').className = 'feedback';
  document.getElementById('fbSubmitBtn').textContent = '确认';
  document.getElementById('fbSubmitBtn').onclick = fbSubmit;
  document.getElementById('fbSkipBtn').style.display = 'inline-block';
}

function fbSubmit() {
  if (fb.idx >= fb.queue.length) return;
  if (fb.answered) { fbNext(); return; }
  fb.answered = true;
  const w = fb.queue[fb.idx];
  const input = document.getElementById('fbInput').value.trim().toLowerCase();
  const answer = w.word.toLowerCase();
  const inp = document.getElementById('fbInput');
  const fbEl = document.getElementById('fbFeedback');
  inp.disabled = true;

  if (input === answer) {
    inp.className = 'fill-input correct';
    fbEl.textContent = '✅ 正确!';
    fbEl.className = 'feedback ok';
    fb.correct++;
  } else {
    inp.className = 'fill-input wrong';
    fbEl.innerHTML = '❌ 错误! 正确答案: <strong>' + w.word + '</strong>';
    fbEl.className = 'feedback bad';
  }
  document.getElementById('fbSubmitBtn').textContent = '下一题';
  document.getElementById('fbSubmitBtn').onclick = fbNext;
  document.getElementById('fbSkipBtn').style.display = 'none';
  updateStats();
  fb.timer = setTimeout(() => { if (fb.answered) fbNext(); }, 1800);
}

function fbSkip() {
  if (fb.answered || fb.idx >= fb.queue.length) return;
  fb.answered = true;
  clearTimeout(fb.timer);
  const w = fb.queue[fb.idx];
  document.getElementById('fbInput').className = 'fill-input wrong';
  document.getElementById('fbInput').disabled = true;
  document.getElementById('fbFeedback').innerHTML = '答案: <strong>' + w.word + '</strong>';
  document.getElementById('fbFeedback').className = 'feedback bad';
  document.getElementById('fbSubmitBtn').textContent = '下一题';
  document.getElementById('fbSubmitBtn').onclick = fbNext;
  document.getElementById('fbSkipBtn').style.display = 'none';
  fb.timer = setTimeout(() => { if (fb.answered) fbNext(); }, 2000);
}

function fbNext() {
  clearTimeout(fb.timer);
  if (fb.idx >= fb.queue.length) return;
  fb.idx++;
  updateStats();
  showFbCard();
}

// ========== Baicizhan ==========
let bz = { queue: [], idx: 0, correct: 0, answered: false, streak: 0 };

function initBaicizhan() {
  bz.queue = shuffle(getWords());
  bz.idx = 0; bz.correct = 0; bz.answered = false; bz.streak = 0;
  restoreBzCard();
  updateStats();
  showBzCard();
}

function restoreBzCard() {
  const card = document.getElementById('bzCard');
  card.innerHTML = `
    <div class="card-tag" id="bzTag"></div>
    <div class="word-big" id="bzWord" style="font-size:2.2rem"></div>
    <div class="word-pos" id="bzPos"></div>
    <div class="options-grid" id="bzOptions"></div>
    <div class="feedback" id="bzFeedback"></div>
    <div style="margin-top:12px">
      <button class="btn btn-ghost" id="bzNextBtn" style="display:none">下一题 </button>
    </div>`;
  document.getElementById('bzNextBtn').onclick = bzNext;
}

function showBzCard() {
  if (bz.idx >= bz.queue.length) {
    const card = document.getElementById('bzCard');
    card.innerHTML = `<div class="done-icon">&#127881;</div><div class="word-big">本轮完成!</div><div class="word-meaning" style="display:block">正确 ${bz.correct} / ${bz.queue.length}</div>`;
    document.getElementById('bzNextBtn') && (document.getElementById('bzNextBtn').style.display = 'none');
    return;
  }
  bz.answered = false;
  const w = bz.queue[bz.idx];
  document.getElementById('bzTag').textContent = w.unit ? 'Unit ' + w.unit : '';
  document.getElementById('bzWord').textContent = w.word;
  document.getElementById('bzPos').textContent = w.pos || '';
  const fbEl = document.getElementById('bzFeedback');
  fbEl.textContent = ''; fbEl.className = 'feedback';
  const nextBtn = document.getElementById('bzNextBtn');
  if (nextBtn) nextBtn.style.display = 'none';

  // Build 4 options: 1 correct + 3 distractors
  const pool = currentUnit === 'all' ? allWords : allWords.filter(x => x.unit === currentUnit);
  const used = new Set([w.meaning_cn]);
  const distractors = [];
  const candidates = shuffle([...pool].filter(x => x.word !== w.word && !used.has(x.meaning_cn)));
  for (const d of candidates) {
    if (distractors.length >= 3) break;
    if (!used.has(d.meaning_cn)) { distractors.push(d); used.add(d.meaning_cn); }
  }
  // If not enough from unit, pull from global
  if (distractors.length < 3) {
    const global = shuffle([...allWords].filter(x => x.word !== w.word && !used.has(x.meaning_cn)));
    for (const d of global) {
      if (distractors.length >= 3) break;
      if (!used.has(d.meaning_cn)) { distractors.push(d); used.add(d.meaning_cn); }
    }
  }
  // Pad if still short
  while (distractors.length < 3) distractors.push({ meaning_cn: '---', word: '' });

  const correctIdx = Math.floor(Math.random() * 4);
  const options = [];
  for (let i = 0; i < 4; i++) {
    if (i === correctIdx) options.push({ meaning: w.meaning_cn, correct: true });
    else options.push({ meaning: distractors.shift().meaning_cn, correct: false });
  }

  const grid = document.getElementById('bzOptions');
  grid.innerHTML = '';
  options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt.meaning;
    btn.onclick = () => bzSelect(i, opt);
    btn.dataset.idx = i;
    grid.appendChild(btn);
  });
}

function bzSelect(idx, opt) {
  if (bz.answered) return;
  bz.answered = true;
  const w = bz.queue[bz.idx];
  const buttons = document.querySelectorAll('#bzOptions .option-btn');
  const fbEl = document.getElementById('bzFeedback');

  buttons.forEach((btn, i) => {
    btn.disabled = true;
    if (btn.textContent === w.meaning_cn) btn.classList.add('correct');
    else if (i === idx && !opt.correct) btn.classList.add('wrong');
  });

  if (opt.correct) {
    bz.correct++; bz.streak++;
    fbEl.textContent = '✅ 正确!';
    fbEl.className = 'feedback ok';
  } else {
    bz.streak = 0;
    fbEl.textContent = '❌ 错误! 正确答案: ' + w.meaning_cn;
    fbEl.className = 'feedback bad';
  }
  updateStats();
  const nextBtn = document.getElementById('bzNextBtn');
  if (nextBtn) { nextBtn.style.display = 'inline-block'; nextBtn.focus(); }
}

function bzNext() {
  if (bz.idx >= bz.queue.length) return;
  bz.idx++; updateStats(); showBzCard();
}

// ========== Stats ==========
function updateStats() {
  const el = (id) => document.getElementById(id);
  let total, correct, streak, attempted;
  if (currentMode === 'flashcard') { total = fc.queue.length; correct = fc.known; streak = 0; attempted = fc.idx; }
  else if (currentMode === 'fillblank') { total = fb.queue.length; correct = fb.correct; streak = 0; attempted = fb.idx; }
  else { total = bz.queue.length; correct = bz.correct; streak = bz.streak; attempted = bz.idx; }
  el('statTotal').textContent = total;
  el('statCorrect').textContent = correct;
  el('statStreak').textContent = streak;
  el('statAccuracy').textContent = attempted > 0 ? Math.round((correct / attempted) * 100) + '%' : '-';
}

// ========== Mode Switching ==========
function switchMode(mode) {
  clearTimeout(fb.timer);
  currentMode = mode;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`[data-mode="${mode}"]`).classList.add('active');
  document.getElementById('modeFlashcard').style.display = mode === 'flashcard' ? 'block' : 'none';
  document.getElementById('modeFillblank').style.display = mode === 'fillblank' ? 'block' : 'none';
  document.getElementById('modeBaicizhan').style.display = mode === 'baicizhan' ? 'block' : 'none';
  if (mode === 'flashcard') initFlashcard();
  else if (mode === 'fillblank') initFillblank();
  else initBaicizhan();
}

// ========== Event Bindings ==========
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => switchMode(t.dataset.mode));
});
document.getElementById('unitSelect').addEventListener('change', (e) => {
  currentUnit = e.target.value;
  switchMode(currentMode);
});
document.getElementById('fcShuffle').addEventListener('change', () => initFlashcard());
document.getElementById('fbShuffle').addEventListener('change', () => initFillblank());
document.getElementById('bzShuffle').addEventListener('change', () => initBaicizhan());

document.getElementById('fcCard').addEventListener('click', flipCard);
document.getElementById('fcBtnNo').addEventListener('click', () => fcAnswer(false));
document.getElementById('fcBtnYes').addEventListener('click', () => fcAnswer(true));
document.getElementById('fcResetBtn').addEventListener('click', () => initFlashcard());

document.getElementById('fbSubmitBtn').addEventListener('click', fbSubmit);
document.getElementById('fbSkipBtn').addEventListener('click', fbSkip);
document.getElementById('fbResetBtn').addEventListener('click', () => initFillblank());
document.getElementById('fbInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); fbSubmit(); }
});

document.getElementById('bzResetBtn').addEventListener('click', () => initBaicizhan());

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') {
    if (e.key === 'Escape' && currentMode === 'fillblank') { e.preventDefault(); fbSkip(); }
    return;
  }
  if (currentMode === 'flashcard' && fc.idx < fc.queue.length) {
    if (e.key === ' ' || e.key === 'Spacebar') { e.preventDefault(); flipCard(); }
    if (e.key === 'ArrowLeft' && fc.flipped) { e.preventDefault(); fcAnswer(false); }
    if (e.key === 'ArrowRight' && fc.flipped) { e.preventDefault(); fcAnswer(true); }
  }
  if (currentMode === 'baicizhan') {
    if (!bz.answered && e.key >= '1' && e.key <= '4') {
      e.preventDefault();
      const buttons = document.querySelectorAll('#bzOptions .option-btn');
      if (buttons[e.key - 1]) buttons[e.key - 1].click();
    }
    if (bz.answered && (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowRight')) {
      e.preventDefault(); bzNext();
    }
  }
});

// ========== Bootstrap ==========
window.addEventListener('DOMContentLoaded', initApp);

</script>
</body>
</html>
